<head>
  <meta charset="utf-8" />

  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div id="bg-root"></div>

  <header class="site-nav" role="navigation">

  <main class="container main">

  <!-- Tiger quick access -->
  <div id="tiger" class="tiger" role="button" tabindex="0" aria-label="顾问 / 快速访问" aria-haspopup="true" aria-expanded="false">
    <!-- geometric tiger SVG (minimal, professional) -->
    <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
      <defs>
        <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7C5CFF" />
          <stop offset="1" stop-color="#2FE5CC" />
        </linearGradient>
      </defs>
      <circle cx="32" cy="32" r="30" fill="url(#tg)" opacity="0.98" />
      <g transform="translate(8,8) scale(0.8)" fill="#0B0B10">
        <path d="M16 6 L24 6 L28 12 L24 18 L16 18 L12 12 Z" opacity="0.98" />
        <path d="M6 20 L58 20 L52 48 L12 48 Z" />
        <path d="M18 30 L26 30" stroke="#7C5CFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />
        <path d="M38 30 L46 30" stroke="#2FE5CC" stroke-width="2" stroke-linecap="round" opacity="0.9" />
      </g>
    </svg>
    <span class="tiger-label">顾问 / 快速访问</span>
  </div>

  <div id="tiger-drawer" class="tiger-drawer" aria-hidden="true">
    <button class="close" aria-label="关闭">×</button>
    <ul>
      <li><a href="/thermal.html">分析仪器</a></li>
      <li><a href="/projects.html">捣鼓</a></li>
      <li><a href="/podcast.html">播客</a></li>
      <li><a href="/bsite.html">B站</a></li>
      <li><a href="/contact.html">联系</a></li>
    </ul>
  </div>

  <script src="/assets/bg.js"></script>
  <script>
    // nav toggle
    (function(){
      const btn = document.querySelector('.nav-toggle');
      const links = document.querySelector('.links');
      btn.addEventListener('click', ()=>{
        const expanded = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', String(!expanded));
        links.classList.toggle('open');
      });
    })();

    // tiger drawer
    (function(){
      const tiger = document.getElementById('tiger');
      const drawer = document.getElementById('tiger-drawer');
      const closeBtn = drawer.querySelector('.close');
      function open(){ drawer.setAttribute('aria-hidden','false'); tiger.setAttribute('aria-expanded','true'); drawer.classList.add('open'); }
      function close(){ drawer.setAttribute('aria-hidden','true'); tiger.setAttribute('aria-expanded','false'); drawer.classList.remove('open'); }
      tiger.addEventListener('click', ()=>{ if(drawer.classList.contains('open')) close(); else open(); });
      tiger.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' ') { e.preventDefault(); tiger.click(); } });
      closeBtn.addEventListener('click', close);
      document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') close(); });
    })();
  </script>
</body>
</html>
