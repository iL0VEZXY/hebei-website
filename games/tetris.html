<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>俄罗斯方块 | 河北的工作小站</title>
    <meta name="description" content="一个自制俄罗斯方块小游戏，支持键盘和触控。" />
    <style>
      :root {
        --bg-0: #040812;
        --bg-1: #0a1323;
        --panel: rgba(14, 20, 31, 0.78);
        --panel-strong: rgba(12, 18, 30, 0.95);
        --border: rgba(146, 176, 255, 0.22);
        --text: #edf3ff;
        --muted: #b9c9ec;
        --accent: #8cc8ff;
        --accent-2: #9c8dff;
        --warning: #ffe69a;
        --danger: #ff8ab7;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg-0);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(circle at 15% 16%, rgba(120, 130, 255, 0.18), transparent 18%),
          radial-gradient(circle at 82% 10%, rgba(0, 214, 255, 0.14), transparent 20%),
          linear-gradient(180deg, #060b16, #040812 62%, #02050e 100%);
      }

      .game-shell {
        width: min(960px, calc(100% - 20px));
        margin: 26px auto 40px;
        border-radius: 22px;
        background: rgba(12, 17, 27, 0.68);
        border: 1px solid var(--border);
        box-shadow: 0 24px 60px rgba(7, 11, 21, 0.7), inset 0 1px 0 rgba(255,255,255,0.04);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        padding: 18px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }

      .topbar h1 {
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 2.4rem);
        letter-spacing: 0.08em;
      }

      .action-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .action-row a,
      .action-row button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        cursor: pointer;
      }

      .action-row .primary {
        background: linear-gradient(135deg, #8cc8ff, #d5c8ff 100%);
        color: #081722;
        border-color: transparent;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 220px;
        gap: 18px;
      }

      .game-panel {
        border-radius: 18px;
        border: 1px solid var(--border);
        background: rgba(9, 15, 25, 0.86);
        padding: 16px;
      }

      .game-wrap {
        display: grid;
        place-items: center;
        min-height: 540px;
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(15, 23, 36, 0.94), rgba(8, 12, 18, 0.96));
        border: 1px solid rgba(255,255,255,0.04);
      }

      canvas {
        display: block;
        width: min(100%, 330px);
        height: auto;
        border-radius: 8px;
        background: linear-gradient(180deg, rgba(16, 22, 33, 0.94), rgba(5, 8, 15, 0.96));
        box-shadow: inset 0 0 24px rgba(125, 158, 255, 0.08);
      }

      .side-panel {
        display: grid;
        gap: 16px;
      }

      .stat-card,
      .controls {
        border-radius: 16px;
        border: 1px solid var(--border);
        background: rgba(16, 22, 33, 0.8);
        padding: 14px;
      }

      .stat-list {
        display: grid;
        gap: 10px;
      }

      .stat-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .stat-item strong {
        color: var(--text);
        font-size: 1.1rem;
      }

      .button-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .button-grid button {
        min-height: 44px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(255,255,255,0.02);
        color: var(--text);
        cursor: pointer;
        font-weight: 700;
      }

      .button-grid .wide {
        grid-column: span 2;
      }

      .status {
        font-size: 0.92rem;
        color: var(--warning);
        line-height: 1.7;
      }

      @media (max-width: 720px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .game-wrap {
          min-height: 420px;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <div class="topbar">
        <h1>俄罗斯方块</h1>
        <div class="action-row">
          <a href="../tinkering.html">返回捣鼓页</a>
          <a href="index.html" class="primary">游戏列表</a>
        </div>
      </div>

      <div class="layout">
        <div class="game-panel">
          <div class="game-wrap">
            <canvas id="tetris" width="300" height="600" aria-label="俄罗斯方块游戏区"></canvas>
          </div>
        </div>

        <aside class="side-panel">
          <div class="stat-card">
            <div class="stat-list">
              <div class="stat-item"><span>分数</span><strong id="score">0</strong></div>
              <div class="stat-item"><span>行数</span><strong id="lines">0</strong></div>
              <div class="stat-item"><span>等级</span><strong id="level">1</strong></div>
            </div>
          </div>

          <div class="controls">
            <div class="button-grid">
              <button type="button" data-action="left">◀ 左</button>
              <button type="button" data-action="right">右 ▶</button>
              <button type="button" data-action="rotate">⟳ 旋转</button>
              <button type="button" data-action="down">↓ 下落</button>
              <button type="button" data-action="pause" class="wide">⏸ 暂停 / 继续</button>
              <button type="button" data-action="restart" class="wide">↺ 重开</button>
            </div>
          </div>

          <div class="stat-card">
            <div class="status" id="status">点击开始，准备起飞。</div>
          </div>
        </aside>
      </div>
    </div>

    <script>
      (() => {
        const COLS = 12;
        const ROWS = 20;
        const BLOCK = 24;
        const BOARD_WIDTH = COLS * BLOCK;
        const BOARD_HEIGHT = ROWS * BLOCK;

        const canvas = document.getElementById('tetris');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const linesEl = document.getElementById('lines');
        const levelEl = document.getElementById('level');
        const statusEl = document.getElementById('status');

        const SHAPES = [
          { color: '#ff2d55', matrix: [[1, 1, 1, 1]] },
          { color: '#3d7bff', matrix: [[1, 1], [1, 1]] },
          { color: '#b14dff', matrix: [[0, 1, 0], [1, 1, 1]] },
          { color: '#4dff5a', matrix: [[0, 1, 1], [1, 1, 0]] },
          { color: '#ff2fd0', matrix: [[1, 1, 0], [0, 1, 1]] },
          { color: '#00f0ff', matrix: [[1, 0, 0], [1, 1, 1]] },
          { color: '#ff9f1c', matrix: [[0, 0, 1], [1, 1, 1]] },
        ];

        let board = [];
        let current = null;
        let score = 0;
        let lines = 0;
        let level = 1;
        let gameLoop = null;
        let lastTime = 0;
        let dropAccumulator = 0;
        let gameStarted = false;
        let isPaused = false;
        let isGameOver = false;

        function createBoard() {
          return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
        }

        function randomShape() {
          const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
          return {
            color: shape.color,
            matrix: shape.matrix.map(row => [...row]),
            x: Math.floor((COLS - shape.matrix[0].length) / 2),
            y: -1,
          };
        }

        function resetGame() {
          board = createBoard();
          score = 0;
          lines = 0;
          level = 1;
          current = randomShape();
          isPaused = false;
          isGameOver = false;
          gameStarted = true;
          updateHud();
          statusEl.textContent = '游戏中，方向键控制移动。';
          if (gameLoop) cancelAnimationFrame(gameLoop);
          lastTime = 0;
          dropAccumulator = 0;
          gameLoop = requestAnimationFrame(loop);
        }

        function updateHud() {
          scoreEl.textContent = String(score);
          linesEl.textContent = String(lines);
          levelEl.textContent = String(level);
        }

        function collides(shape, offsetX = 0, offsetY = 0, testMatrix = shape.matrix) {
          for (let y = 0; y < testMatrix.length; y += 1) {
            for (let x = 0; x < testMatrix[y].length; x += 1) {
              if (!testMatrix[y][x]) continue;
              const px = shape.x + x + offsetX;
              const py = shape.y + y + offsetY;
              if (px < 0 || px >= COLS || py >= ROWS) return true;
              if (py >= 0 && board[py][px]) return true;
            }
          }
          return false;
        }

        function mergeShape() {
          for (let y = 0; y < current.matrix.length; y += 1) {
            for (let x = 0; x < current.matrix[y].length; x += 1) {
              if (!current.matrix[y][x]) continue;
              const px = current.x + x;
              const py = current.y + y;
              if (py >= 0) board[py][px] = current.color;
            }
          }
        }

        function clearLines() {
          let cleared = 0;
          for (let y = ROWS - 1; y >= 0; y -= 1) {
            if (board[y].every(Boolean)) {
              board.splice(y, 1);
              board.unshift(Array(COLS).fill(null));
              cleared += 1;
              y += 1;
            }
          }

          if (cleared > 0) {
            lines += cleared;
            score += [0, 100, 300, 500, 800][cleared] * level;
            level = Math.max(1, Math.floor(lines / 10) + 1);
            updateHud();
          }
        }

        function spawnNext() {
          current = randomShape();
          if (collides(current, 0, 0)) {
            isGameOver = true;
            gameStarted = false;
            statusEl.textContent = '游戏结束：按重开继续。';
            if (gameLoop) cancelAnimationFrame(gameLoop);
            return;
          }
        }

        function move(dx, dy) {
          if (!current || isPaused || isGameOver) return false;
          if (!collides(current, dx, dy)) {
            current.x += dx;
            current.y += dy;
            return true;
          }
          return false;
        }

        function rotateMatrix(matrix) {
          const next = matrix[0].map((_, index) => matrix.map(row => row[index]).reverse());
          return next;
        }

        function rotateCurrent() {
          if (!current || isPaused || isGameOver) return;
          const rotated = rotateMatrix(current.matrix);
          const kicks = [0, -1, 1, -2, 2];
          for (const offset of kicks) {
            if (!collides(current, offset, 0, rotated)) {
              current.matrix = rotated;
              current.x += offset;
              return;
            }
          }
        }

        function tick() {
          if (!current || isPaused || isGameOver) return;
          if (!collides(current, 0, 1)) {
            current.y += 1;
          } else {
            mergeShape();
            clearLines();
            spawnNext();
          }
        }

        function loop(timestamp) {
          if (!gameStarted) return;
          if (!lastTime) lastTime = timestamp;
          const delta = timestamp - lastTime;
          lastTime = timestamp;
          dropAccumulator += delta;

          const speed = Math.max(130, 620 - (level - 1) * 45);
          if (dropAccumulator >= speed) {
            tick();
            dropAccumulator = 0;
          }

          draw();
          gameLoop = requestAnimationFrame(loop);
        }

        function drawCell(x, y, color) {
          ctx.fillStyle = color;
          ctx.fillRect(x * BLOCK, y * BLOCK, BLOCK, BLOCK);

          ctx.strokeStyle = 'rgba(255,255,255,0.12)';
          ctx.strokeRect(x * BLOCK + 0.5, y * BLOCK + 0.5, BLOCK - 1, BLOCK - 1);
        }

        function drawBoard() {
          for (let y = 0; y < ROWS; y += 1) {
            for (let x = 0; x < COLS; x += 1) {
              if (board[y][x]) drawCell(x, y, board[y][x]);
              else {
                ctx.fillStyle = 'rgba(255,255,255,0.02)';
                ctx.fillRect(x * BLOCK, y * BLOCK, BLOCK, BLOCK);
              }
            }
          }
        }

        function drawPiece() {
          if (!current) return;
          for (let y = 0; y < current.matrix.length; y += 1) {
            for (let x = 0; x < current.matrix[y].length; x += 1) {
              if (!current.matrix[y][x]) continue;
              const px = current.x + x;
              const py = current.y + y;
              if (py >= 0) drawCell(px, py, current.color);
            }
          }
        }

        function draw() {
          ctx.clearRect(0, 0, BOARD_WIDTH, BOARD_HEIGHT);
          ctx.fillStyle = '#0a111d';
          ctx.fillRect(0, 0, BOARD_WIDTH, BOARD_HEIGHT);
          drawBoard();
          drawPiece();
        }

        function togglePause() {
          if (!gameStarted || isGameOver) return;
          isPaused = !isPaused;
          statusEl.textContent = isPaused ? '已暂停，按继续。' : '游戏中，方向键控制移动。';
        }

        function handleAction(action) {
          if (!gameStarted && action !== 'restart') {
            statusEl.textContent = '点击开始或重开，再操作方块。';
            return;
          }

          if (isGameOver && action !== 'restart') return;

          switch (action) {
            case 'left':
              move(-1, 0);
              break;
            case 'right':
              move(1, 0);
              break;
            case 'down':
              tick();
              break;
            case 'rotate':
              rotateCurrent();
              break;
            case 'pause':
              togglePause();
              break;
            case 'restart':
              resetGame();
              break;
            default:
              break;
          }
        }

        document.addEventListener('keydown', (event) => {
          const key = event.key.toLowerCase();
          if (['arrowleft', 'arrowright', 'arrowdown', 'arrowup', ' ', 'p'].includes(key) || [' ','p'].includes(event.code)) {
            event.preventDefault();
          }

          if (key === 'arrowleft') handleAction('left');
          if (key === 'arrowright') handleAction('right');
          if (key === 'arrowdown') handleAction('down');
          if (key === 'arrowup' || key === 'w' || event.code === 'Space') handleAction('rotate');
          if (key === 'p') handleAction('pause');
          if (key === 'r') handleAction('restart');
        });

        document.querySelectorAll('[data-action]').forEach((button) => {
          button.addEventListener('click', () => handleAction(button.dataset.action));
        });

        window.addEventListener('beforeunload', () => {
          if (gameLoop) cancelAnimationFrame(gameLoop);
        });

        resetGame();
        draw();
      })();
    </script>
  </body>
</html>
